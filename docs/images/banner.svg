<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Phonomenal — Record. Align. Speak.</title><desc id="desc">Speech recordings become a portable voice pack, then a native C++ engine mixes new sentences. Gruvbox interfaces built with FT.</desc><rect width="1200" height="470" rx="18" fill="#282828"/><rect x="26" y="26" width="1148" height="418" rx="12" fill="#32302f" stroke="#504945"/><g font-family="monospace"><text x="60" y="80" font-size="17" letter-spacing="3" fill="#a89984">RECORDED VOICES / NEW SENTENCES</text><text x="56" y="158" font-size="72" font-weight="bold" fill="#fabd2f">Phonomenal</text><text x="61" y="202" font-size="21" fill="#ebdbb2">Record. Align. Speak.</text><rect x="60" y="256" width="314" height="122" rx="9" fill="#282828" stroke="#665c54"/><rect x="60" y="256" width="6" height="122" rx="3" fill="#b8bb26"/><text x="82" y="298" font-size="23" fill="#b8bb26">01 / GENERATOR</text><text x="82" y="337" font-size="16" fill="#ebdbb2">MP3s + microphone</text><rect x="443" y="256" width="314" height="122" rx="9" fill="#282828" stroke="#665c54"/><rect x="443" y="256" width="6" height="122" rx="3" fill="#83a598"/><text x="465" y="298" font-size="23" fill="#83a598">02 / .VCPACK</text><text x="465" y="337" font-size="16" fill="#ebdbb2">Audio + aligned sounds</text><rect x="826" y="256" width="314" height="122" rx="9" fill="#282828" stroke="#665c54"/><rect x="826" y="256" width="6" height="122" rx="3" fill="#d3869b"/><text x="848" y="298" font-size="23" fill="#d3869b">03 / C++ PLAYER</text><text x="848" y="337" font-size="16" fill="#ebdbb2">Long chunks + matched joins</text><path d="M390 317h34m-10-9 10 9-10 9M773 317h34m-10-9 10 9-10 9" stroke="#928374" stroke-width="3" fill="none"/><text x="60" y="417" font-size="17" fill="#a89984">FT + GRUVBOX</text><text x="821" y="417" font-size="17" fill="#a89984">LINUX / WINDOWS</text></g></svg>